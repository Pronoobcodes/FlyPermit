services:
  - type: web
    name: flypermit
    runtime: python
    buildCommand: pip install uv && uv sync && uv run python manage.py collectstatic --noinput
    startCommand: uv run gunicorn config.wsgi:application --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHON_VERSION
        value: "3.11"
